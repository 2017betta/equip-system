<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>裝備平台</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
:root{
  --blue:#0b3d91; --blue2:#144fb8; --line:#dbe7f3; --text:#101828; --muted:#667085;
  --danger:#b91c1c; --ok:#15803d; --shadow:0 14px 30px rgba(11,61,145,.08)
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#e8f4ff 0%,#f8fbff 100%)}
.topbar{background:linear-gradient(90deg,var(--blue),var(--blue2));color:#fff;text-align:center;padding:18px 14px;font-size:clamp(24px,4vw,32px);font-weight:900}
.wrap{max-width:1380px;margin:18px auto;padding:0 14px 30px}
.panel{background:#fff;border-radius:24px;padding:26px;border:1px solid rgba(11,61,145,.08);box-shadow:var(--shadow)}
.center{text-align:center}.hidden{display:none!important}
.row{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-items:center}
.main-buttons{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-bottom:24px}
button{border:none;border-radius:14px;padding:13px 22px;font-size:16px;font-weight:700;cursor:pointer;min-height:50px}
.primary{background:linear-gradient(180deg,var(--blue2),var(--blue));color:#fff}
.secondary{background:#fff;color:var(--blue);border:2px solid var(--blue)}
.active-btn,.login-active,.pick-active{background:linear-gradient(180deg,var(--blue2),var(--blue))!important;color:#fff!important;border-color:var(--blue)!important}
.mode-card{background:linear-gradient(180deg,#fff,#fbfdff);border:1px solid var(--line);border-radius:20px;padding:28px;margin:0 auto 24px auto}
.mode-title{font-size:clamp(22px,3.4vw,30px);font-weight:900;margin-bottom:18px;text-align:center}
.section{display:none}
input,textarea,select{border:1px solid #c8d6e5;border-radius:12px;padding:12px 14px;font-size:16px;background:#fff;max-width:100%}
textarea{width:min(96vw,420px);height:92px;resize:vertical}
.notice{font-size:14px;color:var(--muted);line-height:1.5}
.summary-box{max-width:1100px;margin:22px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;line-height:2}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:12px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:9999}.toast.show{opacity:1}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.stock-3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:start}
.stock-3>div{min-width:0}.stock-3 .table-wrap{padding:18px;border-radius:12px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.05)}.table-wrap h3{text-align:center;font-size:18px;margin-bottom:10px}
.login-grid{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));gap:14px;max-width:760px;margin:0 auto 8px}
.login-grid button{width:100%}
.login-box{max-width:460px;margin:18px auto 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
.kpi .l{font-size:13px;color:var(--muted);font-weight:800}.kpi .v{font-size:32px;font-weight:900;margin-top:8px}
.rank-box{max-width:1100px;margin:14px auto 0 auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed #e7eef7}.rank-item:last-child{border-bottom:none}
table{width:100%;border-collapse:collapse;margin-top:10px;background:#fff;font-size:15px}
th,td{border:1px solid #e6eaf0;padding:10px;text-align:center;vertical-align:middle}
th{background:#f8fafc}.table-wrap{overflow:auto}
.low-stock-row td{background:#fff5f5}.danger{color:var(--danger);font-weight:800}.ok{color:var(--ok);font-weight:800}
#productButtons,#sizeButtons{gap:20px 28px;margin-bottom:18px}
.category-tabs{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:18px}
.product-grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-bottom:14px}
#sizeButtons{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:8px}
#qtyRow{margin-top:18px;gap:18px}
#labelsBox{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px;max-width:1180px;margin:24px auto 0}
.label{position:relative;border:1px solid #222;border-radius:16px;padding:18px;min-height:260px;background:#fff;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;opacity:.08;transform:rotate(-18deg);pointer-events:none}
.label-top,.label-size,.label-code{position:relative;z-index:2;text-align:center}
.label-top{font-size:20px;font-weight:900;margin-top:2px}
.label-size{font-size:16px;margin:8px 0 12px}
.label-code{font-size:14px;line-height:1.25;word-break:break-all;margin-top:12px}
.code-row{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;gap:18px;width:100%;margin-top:10px}
.qr-box,.barcode-box{display:flex;justify-content:center;align-items:center}
.barcode-box svg{width:138px;height:52px}
.reader{width:min(96vw,460px);margin:12px auto;min-height:40px}
.reader video{width:100%;display:block;border-radius:14px;border:1px solid var(--line);background:#000}
.scan-status{font-size:13px;color:var(--muted);text-align:center;margin-top:10px}
.chart-wrap{max-width:1100px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}
#reportSvg{width:100%;height:auto;display:block}
.small-btn{padding:7px 10px;font-size:14px;border-radius:999px}
.history-box{max-width:1100px;margin:22px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}
.print-hint{font-size:13px;color:#667085;text-align:center;margin-top:8px}
.danger-btn{background:#dc2626;color:#fff}
@media (max-width:1024px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .grid-2{grid-template-columns:1fr}
  .main-buttons button{flex:1 1 42%}
  #labelsBox{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr}
  button{width:100%}
  #labelsBox{grid-template-columns:1fr}
  .code-row{flex-direction:column}
  #productButtons,#sizeButtons{gap:16px}
  #qtyRow{flex-direction:column;gap:14px}
}

/* ===== V28 style cover / login only ===== */
.login-screen{
  min-height:calc(100vh - 120px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 18% 20%, rgba(56,189,248,.22), transparent 30%),
    radial-gradient(circle at 82% 28%, rgba(11,61,145,.25), transparent 30%),
    linear-gradient(135deg,#0f172a 0%,#111827 52%,#1e3a8a 100%);
  border-radius:28px;
}
.login-screen::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(15,23,42,.22);
  pointer-events:none;
}
.glass-login{
  position:relative;
  z-index:2;
  width:min(430px,92%);
  padding:42px 34px 30px;
  border-radius:24px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  box-shadow:0 25px 50px rgba(0,0,0,.28);
}
.glass-login h2{
  color:#fff;
  text-align:center;
  margin:0 0 10px;
  letter-spacing:2px;
  font-weight:900;
}
.glass-subtitle{
  color:rgba(255,255,255,.82);
  text-align:center;
  font-size:13px;
  margin-bottom:22px;
}
.person-pills{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
  margin-bottom:20px;
}
.person-pills button{
  width:100%;
  min-height:46px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;
  font-weight:800;
}
.person-pills button.pick-active,
.person-pills button.login-active{
  background:#0ea5e9!important;
  border-color:#0ea5e9!important;
  color:#fff!important;
}
.glass-input-group{
  position:relative;
  margin-bottom:22px;
}
.glass-input-group input{
  width:100%;
  padding:14px 12px 12px 14px;
  border:none;
  border-bottom:1.5px solid rgba(255,255,255,.4);
  background:transparent;
  color:#fff;
  outline:none;
  font-size:15px;
}
.glass-input-group input:focus{
  border-bottom-color:#38bdf8;
}
.glass-input-group input::placeholder{
  color:rgba(255,255,255,.45);
}
.glass-input-group label{
  position:absolute;
  left:0;
  top:-18px;
  font-size:12px;
  color:#38bdf8;
  font-weight:700;
}
.glass-login-btn{
  width:100%;
  padding:14px;
  background:#0ea5e9;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:14px;
  font-weight:900;
  letter-spacing:1.5px;
  cursor:pointer;
  transition:all .25s ease;
}
.glass-login-btn:hover{
  background:#0284c7;
  box-shadow:0 10px 20px rgba(14,165,233,.28);
  transform:translateY(-1px);
}
.glass-hint{
  text-align:center;
  margin-top:18px;
  color:rgba(255,255,255,.72);
  font-size:12px;
}
@media (max-width:640px){
  .login-screen{min-height:calc(100vh - 90px);border-radius:18px}
  .glass-login{padding:28px 20px 24px}
}


.label-preview{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,220px));
  gap:18px;
  justify-content:center;
  margin-top:18px;
}
.print-label{
  position:relative;
  border:2px solid #222;
  border-radius:16px;
  padding:12px;
  background:#fff;
  min-height:220px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}
.print-label .wm{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:900;
  opacity:.06;
  transform:rotate(-18deg);
  pointer-events:none;
}
.print-label .title{
  font-size:26px;
  font-weight:900;
  line-height:1.1;
  margin-top:2px;
}
.print-label .size{
  font-size:18px;
  margin:8px 0 10px;
}
.print-label .code-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
}
.print-label .qr{
  width:72px;
  height:72px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.print-label .barcode svg{
  width:118px;
  height:48px;
}
.print-label .code{
  font-size:14px;
  margin-top:10px;
  letter-spacing:.5px;
}
@media print{
  body *{visibility:hidden}
  #labelPreview, #labelPreview *{visibility:visible}
  #labelPreview{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    display:grid;
    grid-template-columns:repeat(2,72mm);
    gap:8mm;
    justify-content:center;
    margin:0;
    padding:4mm;
  }
  .print-label{
    min-height:52mm;
    padding:6px 8px;
    border-radius:10px;
    border:1px solid #222;
    page-break-inside:avoid;
  }
  .print-label .title{font-size:16px}
  .print-label .size{font-size:14px;margin:2px 0 6px}
  .print-label .qr{width:64px;height:64px}
  .print-label .barcode svg{width:108px;height:40px}
  .print-label .code{font-size:12px;margin-top:4px}
  .print-label .wm{font-size:24px}
}

.permission-panel{max-width:460px;margin:20px auto;padding:18px 20px;background:#fff;border:1px solid #dbe3f0;border-radius:16px;box-shadow:0 8px 18px rgba(15,23,42,.06)}
.permission-title{text-align:center;font-size:20px;font-weight:900;margin-bottom:6px}
.permission-hint{text-align:center;font-size:13px;color:#667085;margin-bottom:12px}
.permission-row{display:flex;align-items:center;justify-content:space-between;gap:14px;max-width:330px;margin:12px auto;font-weight:800}
.switch{position:relative;display:inline-block;width:54px;height:30px}.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#cbd5e1;border-radius:999px;transition:.25s}
.slider:before{content:"";position:absolute;width:24px;height:24px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.25s;box-shadow:0 2px 5px rgba(0,0,0,.22)}
.switch input:checked + .slider{background:#0b3d91}.switch input:checked + .slider:before{transform:translateX(24px)}
.stock-permission-status{max-width:520px;margin:0 auto 16px;padding:12px 14px;border-radius:14px;text-align:center;font-weight:900}
.stock-permission-status.ok{background:#ecfdf3;color:#027a48;border:1px solid #abefc6}
.stock-permission-status.no{background:#fff1f3;color:#c01048;border:1px solid #fecdd3}
.stock-locked{opacity:.45;pointer-events:none;filter:grayscale(.2)}


/* V29 side permission panel layout */
.stock-control-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 280px;
  gap:18px;
  align-items:start;
  max-width:1280px;
  margin:0 auto;
}
.stock-main-area{min-width:0}
.stock-side-area{
  position:sticky;
  top:16px;
  align-self:start;
}
.stock-side-area .permission-panel{
  margin:0;
  padding:14px 14px;
  border-radius:14px;
  max-width:280px;
  box-shadow:0 8px 18px rgba(15,23,42,.06);
}
.stock-side-area .permission-title{
  font-size:18px;
  margin-bottom:4px;
}
.stock-side-area .permission-hint{
  font-size:12px;
  line-height:1.4;
  margin-bottom:10px;
}
.stock-side-area .permission-row{
  max-width:230px;
  margin:9px auto;
  font-size:14px;
}
.stock-side-area .switch{
  width:44px;
  height:24px;
}
.stock-side-area .slider:before{
  width:18px;
  height:18px;
  left:3px;
  bottom:3px;
}
.stock-side-area .switch input:checked + .slider:before{
  transform:translateX(20px);
}
@media (max-width:900px){
  .stock-control-layout{
    grid-template-columns:1fr;
  }
  .stock-side-area{
    position:static;
    order:-1;
  }
  .stock-side-area .permission-panel{
    max-width:460px;
    margin:0 auto 16px;
  }
}

</style>
</head>
<body>
<div class="topbar">裝備平台</div>
<div id="toast" class="toast"></div>

<div class="wrap">
  
<div id="loginView" class="panel center login-screen">
  <div class="glass-login">
    <h2>LOGIN</h2>
    <div class="glass-subtitle">裝備平台｜請先選擇人員，再輸入密碼</div>

    <div id="loginRow" class="person-pills">
      <button id="login-jerry" onclick="selectCoach('jerry')">佳祐</button>
      <button id="login-msmdick" onclick="selectCoach('msmdick')">土豆</button>
      <button id="login-h072012" onclick="selectCoach('h072012')">小宇</button>
      <button id="login-zemo" onclick="selectCoach('zemo')">阿澤</button>
      <button id="login-ma" onclick="selectCoach('ma')">小馬</button>
      <button id="login-chuu" onclick="selectCoach('chuu')">莉筑</button>
    </div>

    <div id="selectedUserText" class="glass-subtitle">請先選擇人員</div>

    <div class="glass-input-group">
      <label>密碼</label>
      <input id="pwInput" type="password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter') login()">
    </div>

    <button id="submitBtn" class="glass-login-btn" onclick="login()">登入</button>
    <div class="glass-hint">Betta Inline Skate Club Equipment System</div>
  </div>
</div>

<div id="appView" class="panel hidden">
    <h2 class="center" id="welcomeText"></h2>

    <div class="main-buttons">
      <button id="navIn" class="secondary" onclick="showView('in')">📦進貨</button>
      <button id="navOut" class="secondary" onclick="showView('out')">📤出貨</button>
      <button id="navStock" class="secondary" onclick="showView('stock')">📋庫存</button>
      <button id="navReport" class="secondary" onclick="showView('report')">📊報表</button>
      <button class="primary" onclick="toggleBigMode()">🔍大字模式</button>
      <button class="primary" onclick="logout()">🚪登出</button>
      <button id="resetTestBtn" class="danger-btn hidden" onclick="resetTestData()">🧹清空測試資料</button>
    </div>

    <section id="viewIn" class="section">
      <div id="stockPermissionStatus" class="stock-permission-status"></div>
      <div class="mode-card">
        <div class="mode-title">步驟1：印貼紙</div>
        <div class="row" id="productButtons"></div>
        <div class="row" id="sizeButtons" style="display:none"></div>
        <div class="row" id="qtyRow" style="display:none">
          <input id="qtyInput" type="number" min="1" value="1" style="max-width:180px">
          <button class="primary" onclick="createPrintedLabels()">產生貼紙</button>
        </div>
      </div>

      <div id="stockInArea" class="mode-card">
        <div class="mode-title">步驟2：掃描或輸入後入庫</div>
        <div class="row">
          <input id="inCodeInput" placeholder="輸入條碼">
          <button class="primary" onclick="addToStock(document.getElementById('inCodeInput').value)">手動回庫</button>
        </div>
        <div id="readerIn" class="reader"></div>
        <div id="scanStatusIn" class="scan-status">電腦不支援鏡頭掃描時，可直接用掃描槍或手動輸入條碼後按 Enter。</div>
        <div class="row">
          <button class="primary" onclick="startScan('in')">開始掃描進貨</button>
          <button class="secondary" onclick="stopScan('in')">停止掃描進貨</button>
        </div>
      </div>

      <div id="printSummary" class="summary-box center"></div>
<div id="labelPreview" class="label-preview"></div>
      <div class="row"><button class="primary" onclick="printLabels()">🖨️列印貼紙</button></div>
      <div class="print-hint">列印版面已調整成置中、放大、間距拉開。</div>
      <div id="labelsBox"></div>
    </section>

    <section id="viewOut" class="section">
      <div class="mode-card">
        <div class="mode-title">出貨</div>
        <div class="row">
          <input id="outCodeInput" placeholder="輸入條碼">
          <button class="primary" onclick="stockOut(document.getElementById('outCodeInput').value)">確認出貨</button>
        </div>
        <div id="readerOut" class="reader"></div>
        <div id="scanStatusOut" class="scan-status">電腦不支援鏡頭掃描時，可直接用掃描槍或手動輸入條碼後按 Enter。</div>
        <div class="row">
          <button class="primary" onclick="startScan('out')">開始掃描出貨</button>
          <button class="secondary" onclick="stopScan('out')">停止掃描出貨</button>
        </div>
      </div>

      <div class="history-box">
        <div class="mode-title" style="font-size:24px;margin-bottom:6px">最近出貨紀錄</div>
        <div class="table-wrap">
          <table id="shipLogTable">
            <tr><th>出貨人</th><th>品項</th><th>尺寸</th><th>條碼</th><th>時間</th></tr>
          </table>
        </div>
      </div>
    </section>

    <section id="viewStock" class="section">
      
      <div class="stock-control-layout">
        <div class="stock-main-area">
          <div id="stockDashboard"></div>
              </div>
        <div class="stock-side-area">
<div id="stockPermissionPanel" class="permission-panel hidden">
        <div class="permission-title">進貨控制面板</div>
        <div class="permission-hint">只有佳祐可以切換。ON＝可以進貨，OFF＝不能進貨</div>
        <div class="permission-row"><span>土豆</span><label class="switch"><input type="checkbox" id="stockPerm-msmdick" onchange="toggleStockPermission('msmdick', this.checked)"><span class="slider"></span></label></div>
        <div class="permission-row"><span>小宇</span><label class="switch"><input type="checkbox" id="stockPerm-h072012" onchange="toggleStockPermission('h072012', this.checked)"><span class="slider"></span></label></div>
        <div class="permission-row"><span>阿澤</span><label class="switch"><input type="checkbox" id="stockPerm-zemo" onchange="toggleStockPermission('zemo', this.checked)"><span class="slider"></span></label></div>
        <div class="permission-row"><span>小馬</span><label class="switch"><input type="checkbox" id="stockPerm-ma" onchange="toggleStockPermission('ma', this.checked)"><span class="slider"></span></label></div>
        <div class="permission-row"><span>莉筑</span><label class="switch"><input type="checkbox" id="stockPerm-chuu" onchange="toggleStockPermission('chuu', this.checked)"><span class="slider"></span></label></div>
      </div>

      
        </div>
      </div>

      <div id="stockAddBox" class="mode-card hidden">

function fixOldCategory(){

  });

function mergeDuplicateProducts(){
  const merged={};
  Object.keys(state.products).forEach(code=>{
    const p=state.products[code];
    const key=(p.category||"未分類")+"__"+p.name;
    if(!merged[key]){
      merged[key]={code,category:p.category||"未分類",name:p.name,sizes:[...(p.sizes||[])]};
    }else{
      merged[key].sizes=[...new Set([...(merged[key].sizes||[]), ...(p.sizes||[])])];
      // remap printed registry / stock product codes to first code
      Object.keys(state.printedRegistry).forEach(bar=>{
        if(state.printedRegistry[bar].productCode===code) state.printedRegistry[bar].productCode=merged[key].code
      })
      Object.keys(state.stock).forEach(bar=>{
        if(state.stock[bar].productCode===code) state.stock[bar].productCode=merged[key].code
      })
    }
  });
  const next={};
  Object.values(merged).forEach(v=>{
    next[v.code]={category:v.category,name:v.name,sizes:[...new Set(v.sizes)]};
  });
  state.products=next;
}


function normalizeSystemData(){
  const cleaned = {};
  const seenProduct = new Set();

  Object.keys(state.products || {}).forEach(code=>{
    const p = state.products[code] || {};
    const category = String(p.category || "未分類").trim();
    const name = String(p.name || code).trim();
    const key = category + "__" + name;

    if(seenProduct.has(key)){
      const keepCode = Object.keys(cleaned).find(k=>{
        const cp = cleaned[k];
        return String(cp.category || "未分類").trim() + "__" + String(cp.name || "").trim() === key;
      });
      if(keepCode){
        cleaned[keepCode].sizes = [
          ...new Set([...(cleaned[keepCode].sizes||[]), ...((p.sizes||[]).map(s=>String(s).trim()).filter(Boolean))])
        ];
      }
      return;
    }

    seenProduct.add(key);
    cleaned[code] = {
      category,
      name,
      sizes:[...new Set((p.sizes || []).map(s=>String(s).trim()).filter(Boolean))]
    };
  });

  state.products = cleaned;
}


function createCode39Svg(text){
  const map={
    "0":"101001101101","1":"110100101011","2":"101100101011","3":"110110010101","4":"101001101011","5":"110100110101",
    "6":"101100110101","7":"101001011011","8":"110100101101","9":"101100101101","A":"110101001011","B":"101101001011",
    "C":"110110100101","D":"101011001011","E":"110101100101","F":"101101100101","G":"101010011011","H":"110101001101",
    "I":"101101001101","J":"101011001101","K":"110101010011","L":"101101010011","M":"110110101001","N":"101011010011",
    "O":"110101101001","P":"101101101001","Q":"101010110011","R":"110101011001","S":"101101011001","T":"101011011001",
    "U":"110010101011","V":"100110101011","W":"110011010101","X":"100101101011","Y":"110010110101","Z":"100110110101",
    "-":"100101011011",".":"110010101101"," ":"100110101101","$":"100100100101","/":"100100101001","+":"100101001001",
    "%":"101001001001","*":"100101101101"
  };
  const encoded="*"+String(text).toUpperCase()+"*";
  let x=0;
  let svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" preserveAspectRatio="none">';
  for(const ch of encoded){
    const p=map[ch]||map["-"];
    for(let i=0;i<p.length;i++){
      const wide=(i%2===0)?(p[i]==="1"?3:1):(p[i]==="1"?9:3);
      if(i%2===0) svg+=`<rect x="${x}" y="0" width="${wide}" height="52" fill="#000"/>`;
      x+=wide;
    }
    x+=2;
  }
  svg+='</svg>';
  return svg;
}

function generateProductCode(category){
  const map={帽子:"MH",護具:"GL",鞋子:"SK",衣服:"CL",零件:"PT"};
  const base=map[category]||"PR";
  let code=base, i=1;
  while(state.products[code]){
    code=base+String(i).padStart(2,"0");
    i++;
  }
  return code;
}
function addProduct(){
  if(!state.isAdmin){
    alert("只有佳祐可以新增商品");
    return;
  }

  const category=document.getElementById("newCategoryInput").value.trim();
  const name=document.getElementById("newNameInput").value.trim();
  const sizes=document.getElementById("newSizesInput").value
    .split(",")
    .map(s=>s.trim())
    .filter(Boolean);

  if(!category || !name || !sizes.length){
    alert("請輸入類別、商品名稱與尺寸/規格");
    return;
  }

  normalizeSystemData();

  let existingCode=null;
  Object.keys(state.products).forEach(code=>{
    const p=state.products[code];
    if((p.category||"未分類")===category && p.name===name){
      existingCode=code;
    }
  });

  if(existingCode){
    state.products[existingCode].sizes=[
      ...new Set([...(state.products[existingCode].sizes||[]), ...sizes])
    ];
    alert("已合併到原本商品，不會重複新增");
  }else{
    const code=generateProductCode(category);
    state.products[code]={category,name,sizes:[...new Set(sizes)]};
    alert("新增商品成功");
  }

  state.selectedCategory=category;
  document.getElementById("newNameInput").value="";
  document.getElementById("newSizesInput").value="";

  saveState();
  renderProductButtons();
  renderDashboard();
}

  if(!code||!size||!qty||qty<1){alert("請先選商品、尺寸、數量");return;}

  if(!state.counter[key]) state.counter[key]=1;
  const name=state.products[code].name;
  const labelsBox=document.getElementById("labelsBox");
  labelsBox.innerHTML="";
  let first="",last="",qrJobs=[];
  for(let i=0;i<qty;i++){
    const num=String(state.counter[key]).padStart(4,"0");
    const fullCode=code+"-"+size+num;
    if(i===0) first=fullCode;
    last=fullCode;
    state.printedRegistry[fullCode]={category:(state.products[code]&&state.products[code].category)||"未分類",name,size,productCode:code,code:fullCode,printedTime:getNowString(),scannedIn:false};
    const qrId='qr_'+fullCode.replace(/[^A-Za-z0-9]/g,'');
    const div=document.createElement("div");
    div.className="label";
    div.innerHTML='<div class="wm">BETTA</div><div class="label-top">'+name+'</div><div class="label-size">尺寸：'+size+'</div><div class="code-row"><div class="qr-box" id="'+qrId+'"></div><div class="barcode-box">'+createCode39Svg(fullCode)+'</div></div><div class="label-code">'+fullCode+'</div>';
    labelsBox.appendChild(div);
    qrJobs.push({id:qrId,text:fullCode});
    state.counter[key]++;
  }
  saveState();
  document.getElementById("printSummary").innerHTML='✅ 貼紙已建立<br>物品：'+name+'<br>尺寸：'+size+'<br>數量：'+qty+'<br>條碼範圍：'+first+' ～ '+last;
  qrJobs.forEach(job=>{const el=document.getElementById(job.id); if(el) renderQrInto(el,job.text);});
  renderDashboard();
  toast("貼紙已建立");
}


function addToStock(code){
  if(!canCurrentUserStockIn()){
    alert("❌ 你沒有進貨權限，請佳祐在控制面板開啟");
    return;
  }
  code=String(code||"").trim().toUpperCase();
  if(!state.isAdmin){alert("只有佳祐可以進貨");return;}
  if(!state.printedRegistry[code]){alert("此條碼尚未印製");return;}
  if(state.printedRegistry[code].scannedIn){alert("此條碼已入庫");return;}
  const item=state.printedRegistry[code];
  state.stock[code]={category:item.category||((state.products[item.productCode]&&state.products[item.productCode].category)||"未分類"),name:item.name,size:item.size,productCode:item.productCode,code:item.code,status:"in",inTime:getNowString(),outTime:""};
  state.printedRegistry[code].scannedIn=true;
  saveState();
  document.getElementById("inCodeInput").value="";
  renderDashboard();
  toast("已加入庫存");
}
function stockOut(code){

function setScanStatus(target,msg){document.getElementById(target==='in'?'scanStatusIn':'scanStatusOut').textContent=msg;}
async function startScan(target){
  const holder=document.getElementById(target==='in'?'readerIn':'readerOut');
  const stateKey=target==='in'?'scanIn':'scanOut';
  const handler=target==='in'?addToStock:stockOut;
  stopScan(target);
  holder.innerHTML = '<div id="'+(target==='in'?'readerInBox':'readerOutBox')+'"></div>';

  const readerId = target==='in'?'readerInBox':'readerOutBox';
  try{
    if(window.Html5Qrcode){
      const formats = [
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.QR_CODE
      ];
      const scanner = new Html5Qrcode(readerId);
      state[stateKey] = { scanner };
      setScanStatus(target,'掃描中...');
      await scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 220, formatsToSupport: formats },
        (decodedText) => {
          const val = String(decodedText||'').trim().toUpperCase();
          if(val){
            handler(val);
            stopScan(target);
          }
        },
        () => {}
      );
      return;
    }
  }catch(e){
    // continue to native fallback below
  }

  if(!('BarcodeDetector' in window)){
    setScanStatus(target,'這台裝置瀏覽器不支援鏡頭解碼，請改用掃描槍或手動輸入條碼。');
    return;
  }
  try{
    const formats=await BarcodeDetector.getSupportedFormats();
    const want=['code_39','code_128','qr_code'].filter(f=>formats.includes(f));
    if(!want.length){
      setScanStatus(target,'這台裝置沒有可用的掃描格式，請改用掃描槍或手動輸入條碼。');
      return;
    }
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const video=document.createElement('video');
    video.setAttribute('playsinline','true');
    video.autoplay=true;
    video.muted=true;
    video.srcObject=stream;
    holder.innerHTML='';
    holder.appendChild(video);
    const detector=new BarcodeDetector({formats:want});
    const loop=async()=>{
      if(!state[stateKey]) return;
      try{
        const barcodes=await detector.detect(video);
        if(barcodes && barcodes.length){
          const val=String(barcodes[0].rawValue||'').trim().toUpperCase();
          if(val){
            handler(val);
            stopScan(target);
            return;
          }
        }
      }catch(e){}
      state[stateKey].raf=requestAnimationFrame(loop);
    };
    state[stateKey]={stream,video,detector,raf:0};
    setScanStatus(target,'掃描中...');
    video.onloadedmetadata=()=>{video.play(); state[stateKey].raf=requestAnimationFrame(loop);};
  }catch(e){
    setScanStatus(target,'相機打不開，請確認已允許鏡頭權限；不行就改用掃描槍或手動輸入。');
  }
}
function stopScan(target){
  const stateKey=target==='in'?'scanIn':'scanOut';
  const holder=document.getElementById(target==='in'?'readerIn':'readerOut');
  const obj = state[stateKey];
  if(obj){
    try{ if(obj.raf) cancelAnimationFrame(obj.raf); }catch(e){}
    try{ if(obj.stream) obj.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    try{ if(obj.scanner) obj.scanner.stop().then(()=>obj.scanner.clear()).catch(()=>{}); }catch(e){}
    state[stateKey]=null;
  }
  holder.innerHTML='';
  setScanStatus(target,'掃描已停止。');
}
function summaryData(){
  const summary={};
  Object.keys(state.stock).forEach(code=>{
    const item=state.stock[code],k=item.name+"__"+item.size;
    const cat=(state.products[item.productCode]&&state.products[item.productCode].category)||item.category||"未分類";
    if(!summary[k]) summary[k]={category:cat,name:item.name,size:item.size,in:0,out:0};
    if(item.status==="in") summary[k].in++;
    else summary[k].out++;
  });
  return summary;
}
function findPendingPrinted(){
  return Object.keys(state.printedRegistry)
    .filter(code=>!state.printedRegistry[code].scannedIn)
    .sort()
    .map(code=>({code,name:state.printedRegistry[code].name,size:state.printedRegistry[code].size}));
}
function extractCodeParts(code){
  const text=String(code||'').trim().toUpperCase();
  const match=text.match(/^([A-Z0-9]+)-(.+?)(\d{4})$/);
  if(!match) return null;
  return {productCode:match[1],size:match[2],num:parseInt(match[3],10),numText:match[3],prefix:match[1]+'-'+match[2]};
}
function buildSeries(sourceCodes){
  const groups={};
  sourceCodes.forEach(code=>{
    const p=extractCodeParts(code);
    if(!p) return;
    if(!groups[p.prefix]) groups[p.prefix]={productCode:p.productCode,size:p.size,nums:[]};
    groups[p.prefix].nums.push(p.num);
  });
  Object.keys(groups).forEach(k=>groups[k].nums=[...new Set(groups[k].nums)].sort((a,b)=>a-b));
  return groups;
}
function detectInboundMissing(){
  const printedSeries=buildSeries(Object.keys(state.printedRegistry));
  const inboundSet=new Set(Object.keys(state.stock));
  const rows=[];
  Object.keys(printedSeries).forEach(prefix=>{
    const nums=printedSeries[prefix].nums;
    nums.forEach(num=>{
      const code=prefix+String(num).padStart(4,'0');
      if(!inboundSet.has(code)){
        const productName=(state.products[printedSeries[prefix].productCode]||{}).name||printedSeries[prefix].productCode;
        rows.push({item:productName,size:printedSeries[prefix].size,code,status:'進貨漏掃'});
      }
    });
  });
  return rows;
}
function detectOutboundMissing(){
  const inSeries=buildSeries(Object.keys(state.stock));
  const rows=[];
  Object.keys(inSeries).forEach(prefix=>{
    const info=inSeries[prefix];
    const productName=(state.products[info.productCode]||{}).name||info.productCode;
    const nums=info.nums;
    if(nums.length<2) return;
    const outNums=nums.filter(num=>{
      const code=prefix+String(num).padStart(4,'0');
      return state.stock[code] && state.stock[code].status==='out';
    }).sort((a,b)=>a-b);
    if(outNums.length<2) return;
    const min=outNums[0], max=outNums[outNums.length-1];
    for(let n=min;n<=max;n++){
      const code=prefix+String(n).padStart(4,'0');
      if(state.stock[code] && state.stock[code].status!=='out'){
        rows.push({item:productName,size:info.size,code,status:'出貨跳號 / 可能漏掃'});
      }
    }
  });
  return rows;
}

function renderSvgLineChart(labels,datasets){
  const svg=document.getElementById('reportSvg');
  const W=980,H=360,pL=60,pR=40,pT=34,pB=42,innerW=W-pL-pR,innerH=H-pT-pB;
  let vals=[]; datasets.forEach(ds=>ds.data.forEach(v=>{if(v!==null&&v!==undefined) vals.push(Number(v)||0);}));
  const max=Math.max(1,...vals);
  let out=['<rect x="0" y="0" width="'+W+'" height="'+H+'" fill="#fff"/>'];
  for(let i=0;i<5;i++){
    const y=pT+innerH*(i/4), val=Math.round(max*(1-i/4));
    out.push('<line x1="'+pL+'" y1="'+y+'" x2="'+(W-pR)+'" y2="'+y+'" stroke="#e5edf7" stroke-width="1"/>');
    out.push('<text x="'+(pL-12)+'" y="'+(y+4)+'" font-size="12" text-anchor="end" fill="#667085">'+val+'</text>');
  }
  labels.forEach((lab,i)=>{
    const x=(labels.length===1)?(pL+innerW/2):(pL+innerW*i/(labels.length-1));
    out.push('<text x="'+x+'" y="'+(H-12)+'" font-size="12" text-anchor="middle" fill="#667085">'+lab+'</text>');
  });
  datasets.forEach(ds=>{
    let pts=[];
    ds.data.forEach((v,i)=>{
      if(v===null||v===undefined) return;
      const x=(labels.length===1)?(pL+innerW/2):(pL+innerW*i/(labels.length-1));
      const y=pT+innerH-(Number(v)||0)/max*innerH;
      pts.push({x,y,v});
    });
    if(pts.length===1){
      out.push('<line x1="'+pL+'" y1="'+pts[0].y+'" x2="'+(W-pR)+'" y2="'+pts[0].y+'" stroke="'+ds.color+'" stroke-width="3" stroke-dasharray="6 4"/>');
    }else if(pts.length>1){
      out.push('<polyline fill="none" stroke="'+ds.color+'" stroke-width="3" points="'+pts.map(p=>p.x+','+p.y).join(' ')+'"/>');
    }
    pts.forEach(p=>out.push('<circle cx="'+p.x+'" cy="'+p.y+'" r="5" fill="'+ds.color+'"><title>'+ds.label+'：'+p.v+' 件</title></circle>'));
  });
  const legendY=18;
  datasets.forEach((ds,i)=>{
    const x=pL+i*130;
    out.push('<line x1="'+x+'" y1="'+legendY+'" x2="'+(x+26)+'" y2="'+legendY+'" stroke="'+ds.color+'" stroke-width="3"/>');
    out.push('<text x="'+(x+32)+'" y="'+(legendY+4)+'" font-size="12" fill="#344054">'+ds.label+'</text>');
  });
  svg.innerHTML=out.join('');
}


function renderReport(){
  const yearSelect=document.getElementById('reportYearSelect');
  populateReportYears();
  const liveYear=getCurrentYear();
  const selectedYear=parseInt(yearSelect.value||liveYear,10);
  const mode=document.getElementById('reportModeSelect').value;
  const lowCount=Object.values(summaryData()).filter(v=>Number(v.in)<=3).length;
  const currentMonth=(selectedYear===liveYear?getCurrentMonth():12);
  let labels=[],datasets=[],summary='',ranking=[],totalIn=0,totalOut=0,itemCount=0;

  if(mode==='month'){
    const itemMap={};
    state.logs.forEach(log=>{
      const y=getYearFromTimeString(log.time);
      if(y!==selectedYear) return;
      const m=getMonthFromTimeString(log.time);
      if(m>currentMonth) return;
      const name=log.name||'未命名';
      if(!itemMap[name]) itemMap[name]=new Array(currentMonth).fill(0);
      itemMap[name][m-1]+=1;
    });
    labels=Array.from({length:currentMonth},(_,i)=>(i+1)+'月');
    const colors=['#2563eb','#22c55e','#ef4444','#f59e0b','#7c3aed','#14b8a6','#e11d48','#0ea5e9'];
    datasets=Object.keys(itemMap).map((name,i)=>({label:name,data:itemMap[name],color:colors[i%colors.length]}));
    if(!datasets.length) datasets=[{label:'沒有出貨資料',data:new Array(currentMonth).fill(0),color:'#94a3b8'}];
    ranking=Object.entries(itemMap).map(([k,v])=>[k,v.reduce((a,b)=>a+(b||0),0)]).sort((a,b)=>b[1]-a[1]).slice(0,5);
    totalOut=state.logs.filter(log=>getYearFromTimeString(log.time)===selectedYear && getMonthFromTimeString(log.time)<=currentMonth).length;
    itemCount=Object.keys(itemMap).length;
    summary='📊 年份：'+selectedYear+'<br>月報（依現在時間自動顯示到 '+currentMonth+' 月）<br><br>🔥 總出貨：'+totalOut+'<br>📦 商品數：'+itemCount+'<br><br>🏆 熱銷排行<br>'+(ranking.length?ranking.map(r=>r[0]+'：'+r[1]).join('<br>'):'沒有資料')+'<br><br>X軸＝1-'+currentMonth+'月｜線＝物品';
  } else {
    const inMap={}, outMap={};
    Object.values(state.stock).forEach(item=>{if(getYearFromTimeString(item.inTime)!==selectedYear) return; inMap[item.name]=(inMap[item.name]||0)+1; totalIn++;});
    state.logs.forEach(log=>{if(getYearFromTimeString(log.time)!==selectedYear) return; outMap[log.name]=(outMap[log.name]||0)+1; totalOut++;});
    labels=[...new Set([...Object.keys(inMap),...Object.keys(outMap)])];
    if(!labels.length) labels=['沒有資料'];
    datasets=[
      {label:'進貨',data:labels[0]==='沒有資料'?[0]:labels.map(l=>inMap[l]||0),color:'#2563eb'},
      {label:'出貨',data:labels[0]==='沒有資料'?[0]:labels.map(l=>outMap[l]||0),color:'#22c55e'}
    ];
    ranking=labels[0]==='沒有資料'?[]:labels.map(l=>[l,outMap[l]||0]).sort((a,b)=>b[1]-a[1]).slice(0,5);
    itemCount=labels[0]==='沒有資料'?0:labels.length;
    summary='📊 年份：'+selectedYear+'<br><br>📥 進貨：'+totalIn+'<br>📤 出貨：'+totalOut+'<br>📦 商品數：'+itemCount+'<br>📈 出貨率：'+(totalIn>0?Math.round(totalOut/totalIn*100):0)+'%<br><br>X軸＝物品｜線＝進貨 / 出貨';
  }
  renderKpis(mode,totalIn,totalOut,itemCount,lowCount,currentMonth);

  const allZero = datasets.every(ds => ds.data.every(v => Number(v||0)===0));
  if(allZero){
    document.getElementById('reportSvg').innerHTML = '<text x="490" y="170" text-anchor="middle" font-size="18" fill="#98a2b3">目前沒有資料</text>';
  }else{
    renderRanking(ranking);
    renderSvgLineChart(labels,datasets);
  }
  if(allZero) renderRanking(ranking);
  document.getElementById('reportSummary').innerHTML=summary;
}



function xmlEscape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function sheetXml(name,rows){
  let xml='<Worksheet ss:Name="'+xmlEscape(name)+'"><Table>';
  rows.forEach(r=>{xml+='<Row>'; r.forEach(c=>{xml+='<Cell><Data ss:Type="String">'+xmlEscape(c)+'</Data></Cell>';}); xml+='</Row>';});
  xml+='</Table></Worksheet>';
  return xml;
}

  const currentMonth=(year===getCurrentYear()?getCurrentMonth():12);
  const overview=[['年份','模式','進貨總數','出貨總數']];
  const inRows=[['類型','年份','月份','物品','尺寸','條碼','時間']];
  const outRows=[['類型','年份','月份','物品','尺寸','條碼','時間','教練']];
  const monthRows=[['月份','物品','出貨數量']];
  let totalIn=0,totalOut=0;
  Object.values(state.stock).forEach(item=>{
    const y=getYearFromTimeString(item.inTime);
    if(y!==year) return;
    const m=getMonthFromTimeString(item.inTime);
    inRows.push(['進貨',y,m,item.name||'',item.size||'',item.code||'',item.inTime||'']);
    totalIn++;
  });
  state.logs.forEach(log=>{
    const y=getYearFromTimeString(log.time);
    if(y!==year) return;
    const m=getMonthFromTimeString(log.time);
    if(m>currentMonth) return;
    outRows.push(['出貨',y,m,log.name||'',log.size||'',log.code||'',log.time||'',log.user||'']);
    totalOut++;
  });
  const monthMap={};
  state.logs.forEach(log=>{
    const y=getYearFromTimeString(log.time);
    if(y!==year) return;
    const m=getMonthFromTimeString(log.time);
    if(m>currentMonth) return;
    const key=m+'__'+(log.name||'未命名');
    monthMap[key]=(monthMap[key]||0)+1;
  });
  Object.keys(monthMap).sort((a,b)=>{const aa=a.split('__'), bb=b.split('__'); return Number(aa[0])-Number(bb[0]) || aa[1].localeCompare(bb[1]);}).forEach(k=>{const p=k.split('__'); monthRows.push([p[0]+'月',p[1],monthMap[k]]);});
  overview.push([year,mode==='month'?'月報':'年報',totalIn,totalOut]);
  let workbook='<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
  workbook+=sheetXml('總覽',overview);
  workbook+=sheetXml('月報明細',monthRows);
  workbook+=sheetXml('進貨詳細',inRows);
  workbook+=sheetXml('出貨詳細',outRows);
  workbook+='</Workbook>';
  const blob=new Blob([workbook],{type:'application/vnd.ms-excel'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='商業報表_'+year+'_'+mode+'.xls';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

loadState();
normalizeSystemData();
fixOldCategory();
mergeDuplicateProducts();
saveState();
window.addEventListener('load',()=>{populateReportYears();renderReport();});
setInterval(()=>{const reportView=document.getElementById('viewReport'); if(reportView && reportView.style.display==='block'){ renderReport(); }},60000);
</script>
